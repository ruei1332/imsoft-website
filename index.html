<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="utf-8" /><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; worker-src 'none'; media-src 'none'; upgrade-insecure-requests">
    <title>IMSOFTWARE</title>
    <!--
      靜態匯出沒有 middleware,GitHub Pages 也不支援轉址規則,
      所以根路徑只能靠這份 HTML 自己把訪客送到預設語系。
      檔案放在 public/ 之下,next build 會原樣複製成 out/index.html。

      routing.localeDetection 為 false,預設語系固定 zh-TW,
      這裡不做語系偵測,行為才與原本的 next-intl middleware 一致。
    -->
    <!--
      刻意不加 noindex:這個網址是 hreflang 的 x-default 目標,
      標成 noindex 會讓搜尋引擎連帶不信任這條 x-default 宣告。
      meta refresh 本身就是 Google 認可的轉址訊號,權重會傳給 /zh-TW/。
    -->
    <meta http-equiv="refresh" content="0; url=/zh-TW/" />
    <script>
      location.replace("/zh-TW/" + location.search + location.hash);
    </script>
  </head>
  <body>
    <a href="/zh-TW/">IMSOFTWARE</a>
  </body>
</html>
